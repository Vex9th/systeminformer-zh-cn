name: 'zh-cn-build'

on:
  workflow_dispatch:
  push:
    branches: ['zh-cn']
    tags: ['v*-zh-cn*']
    paths-ignore:
      - '**.md'
      - '.editorconfig'
      - '.gitignore'
      - '.vscode/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_MAJORVERSION: '3'
  BUILD_MINORVERSION: '2'

jobs:
  # Branch pushes and manual runs: fast compile verification of the user-mode
  # x64 build only, mirroring the msbuild invocation CustomBuildTool generates
  # (same /graph All matrix targets and properties, narrowed to x64). The full
  # official build_release.cmd pipeline runs only for release tags.
  build-ci:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
    runs-on: 'windows-2025-vs2026'
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

    # Upstream commits pre-signed test driver binaries under
    # KSystemInformer\bin-signed; the SDK post-build step would copy them into
    # the user-mode output. Remove them so this build stays driverless.
    - name: Remove committed driver binaries (driverless build)
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: Remove-Item -Recurse -Force .\KSystemInformer\bin-signed

    - name: NuGet Cache
      id: nuget-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
      with:
        path: |
          packages
          ~\.nuget\packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config', '**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', '**/global.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Nuget Restore
      shell: cmd
      working-directory: ${{github.workspace}}
      run: nuget restore .\packages.config -PackagesDirectory .\packages\

    - name: BuildTools Cache
      id: custombuildtool-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
      with:
        path: tools/CustomBuildTool/bin/Release/**
        key: custombuildtool-${{ runner.os }}-${{ hashFiles('tools/CustomBuildTool/**', '!tools/CustomBuildTool/bin/**') }}
        restore-keys: custombuildtool-${{ runner.os }}-

    - name: BuildThirdParty Cache
      id: thirdparty-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
      with:
        path: tools/thirdparty/**
        key: thirdparty-${{ runner.os }}-${{ hashFiles('tools/thirdparty/**', '!tools/thirdparty/bin/**') }}
        restore-keys: thirdparty-${{ runner.os }}-

    - name: Build Tools
      if: steps.custombuildtool-cache.outputs.cache-hit != 'true' || steps.thirdparty-cache.outputs.cache-hit != 'true'
      shell: cmd
      working-directory: ${{github.workspace}}
      run: build\build_init.cmd

    - name: Build user-mode x64 (CI verification)
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
          Select-Object -First 1
        if (-not $msbuild) { Write-Error "::error::MSBuild.exe not found via vswhere"; exit 1 }
        Write-Host "MSBuild: $msbuild"
        # Same matrix invocation CustomBuildTool generates (Build.cs
        # MsbuildParallelCommandString), narrowed to x64 Release.
        $common = @(
          '/m', '/graph', '/t:All', '/nologo', '/nodereuse:false', '/verbosity:minimal',
          '/p:RestoreUseStaticGraphEvaluation=true',
          '/p:CopyRetryCount=10', '/p:CopyRetryDelayMilliseconds=200',
          '/p:Platform=x64', '/p:Configuration=Release',
          '/p:TargetPlatforms=x64', '/p:TargetConfigurations=Release',
          '/p:ExternalPreprocessorOptions=PH_BUILD_API'
        )
        & $msbuild @common 'SystemInformer.sln'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Write-Host "sdk\include\Release64\phdk.h present after exe build: $(Test-Path 'sdk\include\Release64\phdk.h')"
        # Populate sdk\include\Release64 for the plugin builds. This mirrors
        # the SystemInformer.vcxproj post-build event and is idempotent.
        cmd /c "build\build_zdriver_sdk.cmd bin\Release64\sys_info.exe -Release -x64"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & $msbuild @common 'plugins\Plugins.sln'
        exit $LASTEXITCODE

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.x'

    - name: zh-cn string audit and translation contract check
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        python tools\zhcn\audit.py
        python tools\zhcn\check_translation.py
        python tools\zhcn\generate_translation.py --check
        python tools\zhcn\generate_native_resources.py --check
        python -m unittest discover -s tools\zhcn\tests -v

    - name: Native UI resource loader test
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
          Select-Object -First 1
        if (-not $msbuild) { Write-Error "::error::MSBuild.exe not found via vswhere"; exit 1 }
        & $msbuild /m /nologo /verbosity:minimal /p:Platform=x64 /p:Configuration=Release tools\tests\phlib-test\phlib-test.sln
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & tools\tests\phlib-test\bin\Release64\phlib-test.exe
        exit $LASTEXITCODE

    - name: Validate embedded en-US and zh-CN dialog resources
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: python tools\zhcn\validate_templates.py bin\Release64\sys_info.exe

    - name: Assert driverless output (no .sys / .inf)
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        $forbidden = Get-ChildItem -Path .\bin -Recurse -File -ErrorAction SilentlyContinue |
          Where-Object { $_.Extension -in '.sys', '.inf' }
        if ($forbidden) {
          $forbidden | ForEach-Object { Write-Host "FORBIDDEN: $($_.FullName)" }
          Write-Host "::error::driver files (.sys/.inf) found in build output"
          exit 1
        }
        Write-Host "OK: no .sys or .inf files under bin\"

    - name: Runtime translation smoke test
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\zhcn\smoke_test.ps1 -ExePath bin\Release64\sys_info.exe

    - name: Cache report
      if: always()
      shell: pwsh
      run: |
        $summary = @"
        ## zh-cn CI build summary

        | cache | hit |
        |---|---|
        | NuGet | ${{ steps.nuget-cache.outputs.cache-hit }} |
        | CustomBuildTool | ${{ steps.custombuildtool-cache.outputs.cache-hit }} |
        | ThirdParty | ${{ steps.thirdparty-cache.outputs.cache-hit }} |

        build_init.cmd executed: ${{ steps.custombuildtool-cache.outputs.cache-hit != 'true' || steps.thirdparty-cache.outputs.cache-hit != 'true' }}
        "@
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

  # Release tags: full official user-mode pipeline (build_init + build_release)
  # with no driver jobs, then package the portable zip.
  build-release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    runs-on: 'windows-2025-vs2026'
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

    # Upstream commits pre-signed test driver binaries under
    # KSystemInformer\bin-signed; the SDK post-build step would copy them into
    # the user-mode output. Remove them so this build stays driverless.
    - name: Remove committed driver binaries (driverless build)
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: Remove-Item -Recurse -Force .\KSystemInformer\bin-signed

    - name: NuGet Cache
      id: nuget-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
      with:
        path: |
          packages
          ~\.nuget\packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config', '**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', '**/global.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Nuget Restore
      shell: cmd
      working-directory: ${{github.workspace}}
      run: nuget restore .\packages.config -PackagesDirectory .\packages\

    - name: BuildTools Cache
      id: custombuildtool-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
      with:
        path: tools/CustomBuildTool/bin/Release/**
        key: custombuildtool-${{ runner.os }}-${{ hashFiles('tools/CustomBuildTool/**', '!tools/CustomBuildTool/bin/**') }}
        restore-keys: custombuildtool-${{ runner.os }}-

    - name: BuildThirdParty Cache
      id: thirdparty-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
      with:
        path: tools/thirdparty/**
        key: thirdparty-${{ runner.os }}-${{ hashFiles('tools/thirdparty/**', '!tools/thirdparty/bin/**') }}
        restore-keys: thirdparty-${{ runner.os }}-

    - name: Build Tools
      if: steps.custombuildtool-cache.outputs.cache-hit != 'true' || steps.thirdparty-cache.outputs.cache-hit != 'true'
      shell: cmd
      working-directory: ${{github.workspace}}
      run: build\build_init.cmd

    # User-mode only: the driver jobs of the upstream workflow are intentionally
    # not reproduced (no build_zdriver.cmd, no KSystemInformer).
    - name: Build Solution (release, user-mode only)
      shell: cmd
      working-directory: ${{github.workspace}}
      run: build\build_release.cmd

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.x'

    - name: zh-cn string audit and translation contract check
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        python tools\zhcn\audit.py
        python tools\zhcn\check_translation.py
        python tools\zhcn\generate_translation.py --check
        python tools\zhcn\generate_native_resources.py --check
        python -m unittest discover -s tools\zhcn\tests -v

    - name: Native UI resource loader test
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
          Select-Object -First 1
        if (-not $msbuild) { Write-Error "::error::MSBuild.exe not found via vswhere"; exit 1 }
        & $msbuild /m /nologo /verbosity:minimal /p:Platform=x64 /p:Configuration=Release tools\tests\phlib-test\phlib-test.sln
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & tools\tests\phlib-test\bin\Release64\phlib-test.exe
        exit $LASTEXITCODE

    - name: Validate embedded en-US and zh-CN dialog resources
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: python tools\zhcn\validate_templates.py bin\Release64\sys_info.exe

    - name: Assert driverless output (no .sys / .inf)
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        $forbidden = Get-ChildItem -Path .\bin, .\build\output -Recurse -File -ErrorAction SilentlyContinue |
          Where-Object { $_.Extension -in '.sys', '.inf' }
        if ($forbidden) {
          $forbidden | ForEach-Object { Write-Host "FORBIDDEN: $($_.FullName)" }
          Write-Host "::error::driver files (.sys/.inf) found in build output"
          exit 1
        }
        Write-Host "OK: no .sys or .inf files under bin\ or build\output"

    - name: Runtime translation smoke test
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\zhcn\smoke_test.ps1 -ExePath bin\Release64\sys_info.exe

    - name: Package portable zip
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag
        $staging = Join-Path $env:RUNNER_TEMP "portable-stage"
        if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
        Expand-Archive -Path .\build\output\systeminformer-build-bin.zip -DestinationPath $staging
        # re-assert on the actual package contents
        $forbidden = Get-ChildItem -Path $staging -Recurse -File | Where-Object { $_.Extension -in '.sys', '.inf' }
        if ($forbidden) { $forbidden | ForEach-Object { Write-Host "FORBIDDEN: $($_.FullName)" }; exit 1 }
        Copy-Item .\README.md (Join-Path $staging 'README-zh-CN.md')
        $zip = "systeminformer-$version-portable.zip"
        "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -Force

    - name: Generate SHA-256 and release metadata
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        $hash = (Get-FileHash -Algorithm SHA256 ".\$env:ZIP_NAME").Hash
        "$hash  $env:ZIP_NAME" | Out-File -FilePath .\SHA256SUMS.txt -Encoding ascii
        @("ZIP_NAME=$env:ZIP_NAME", "SHA256=$hash") |
          Out-File -FilePath .\release-meta.txt -Encoding utf8
        Get-Content .\SHA256SUMS.txt
        Get-Content .\release-meta.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: zh-cn-portable
        path: |
          systeminformer-*-portable.zip
          SHA256SUMS.txt
          release-meta.txt
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    permissions:
      contents: write
    runs-on: 'windows-2025-vs2026'
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: zh-cn-portable

    - name: Create GitHub release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        $tag = "${{ github.ref_name }}"
        $meta = @{}
        Get-Content .\release-meta.txt | ForEach-Object {
          $k, $v = $_ -split '=', 2
          $meta[$k.Trim()] = $v.Trim()
        }
        $zip = $meta['ZIP_NAME']
        $sha = $meta['SHA256']
        $lines = @(
          "# System Informer 简体中文社区版 $tag",
          '',
          '本项目是非官方社区 Fork，与 System Informer 官方团队及任何游戏、发行商或反作弊厂商无隶属关系。',
          '',
          '## 下载与校验',
          '',
          "- ``$zip`` — 便携版（解压即用，无需安装）",
          '',
          'SHA-256：',
          '',
          '```',
          $sha,
          '```',
          '',
          '校验示例（PowerShell）：```Get-FileHash -Algorithm SHA256 .\' + $zip + '```',
          '',
          '## 本次发布验收',
          '',
          '- 字符串审计与校验：通过',
          '- 对话框模板校验：通过',
          '- 无驱动断言：通过',
          '- 运行时冒烟脚本：通过',
          '',
          '## 无驱动说明',
          '',
          '本构建不包含内核驱动（KSystemInformer），仅用户态程序；高级内核功能不可用。',
          '无驱动不代表获得游戏反作弊白名单，受保护游戏运行期间请退出本程序。',
          '',
          '上游源码与许可证：https://github.com/winsiderss/systeminformer（MIT）'
        )
        $lines | Out-File -FilePath release-notes.md -Encoding utf8
        gh release create $tag --repo $env:REPO --title "System Informer 简体中文社区版 $tag" --notes-file release-notes.md $zip SHA256SUMS.txt
