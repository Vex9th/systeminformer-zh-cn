name: 'sync-upstream'

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'  # daily 21:30 UTC (05:30 Beijing)

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # Requires the default branch to be zh-cn (scheduled workflows only run
    # from the default branch).
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      with:
        ref: zh-cn
        fetch-depth: 0
        fetch-tags: true

    - name: Configure git
      run: |
        git config user.name "Vex9th"
        git config user.email "Vex9th@users.noreply.github.com"
        git remote add upstream https://github.com/winsiderss/systeminformer.git
        git fetch upstream master

    - name: Check for upstream changes
      id: changes
      run: |
        COUNT=$(git rev-list --count HEAD..upstream/master)
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "upstream commits ahead: $COUNT"

    - name: Merge upstream/master
      if: steps.changes.outputs.count != '0'
      run: |
        git merge upstream/master --no-edit || {
          echo "::error::merge conflict with upstream; manual resolution required"
          echo "conflicted files:"
          git diff --name-only --diff-filter=U
          exit 1
        }

    - name: Audit, translate and regenerate
      if: steps.changes.outputs.count != '0'
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_MODEL: ${{ vars.LLM_MODEL }}
        LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      run: |
        python3 tools/zhcn/audit.py
        # no-op without the LLM_API_KEY secret; new strings stay English
        python3 tools/zhcn/auto_translate.py || true
        python3 tools/zhcn/check_translation.py || true
        python3 tools/zhcn/generate_translation.py

    - name: Translation summary
      if: steps.changes.outputs.count != '0'
      id: zhcn-summary
      run: |
        if grep -q "^## 未翻译字符串" tools/zhcn/coverage-report.md; then
          echo "has_untranslated=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_untranslated=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit and push sync
      if: steps.changes.outputs.count != '0'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git add -A
        if git diff --cached --quiet; then
          echo "merge produced no changes"
          exit 0
        fi
        RANGE="$(git rev-parse --short upstream/master~${{ steps.changes.outputs.count }})..$(git rev-parse --short upstream/master)"
        git commit -m "chore(sync): 合并上游 master ($RANGE)"
        git push origin zh-cn

    - name: Open issue for untranslated strings
      if: steps.changes.outputs.count != '0' && steps.zhcn-summary.outputs.has_untranslated == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        {
          echo "上游合并后发现未翻译字符串，已推送合并但未触发自动发布。"
          echo
          echo '```
          '"$(grep -A 40 '## 未翻译字符串' tools/zhcn/coverage-report.md | head -40)"'
          ```'
          echo
          echo "补翻 tools/zhcn/zh-CN.json 后运行 tools/zhcn 流程并打 tag 即可发布。"
        } > issue-body.md
        gh issue create --repo "$GITHUB_REPOSITORY" \
          --title "上游同步：新增字符串待翻译" \
          --body-file issue-body.md || true
