name: 'sync-upstream'

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'  # daily 21:30 UTC (05:30 Beijing)

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # Requires the default branch to be zh-cn (scheduled workflows only run
    # from the default branch).
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      with:
        ref: zh-cn
        fetch-depth: 0
        fetch-tags: true

    - name: Configure git
      run: |
        git config user.name "Vex9th"
        git config user.email "Vex9th@users.noreply.github.com"
        git remote add upstream https://github.com/winsiderss/systeminformer.git
        git fetch upstream master

    - name: Check for upstream changes
      id: changes
      run: |
        COUNT=$(git rev-list --count HEAD..upstream/master)
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "upstream commits ahead: $COUNT"

    - name: Merge upstream/master
      if: steps.changes.outputs.count != '0'
      run: |
        git merge upstream/master --no-edit || {
          echo "::error::merge conflict with upstream; manual resolution required"
          echo "conflicted files:"
          git diff --name-only --diff-filter=U
          exit 1
        }

    - name: Audit and validate native resources
      if: steps.changes.outputs.count != '0'
      run: |
        python3 tools/zhcn/audit.py
        python3 tools/zhcn/check_translation.py --fail-on-untranslated
        python3 tools/zhcn/generate_native_resources.py
        python3 tools/zhcn/generate_native_resources.py --check
        python3 -m unittest discover -s tools/zhcn/tests -q

    - name: Commit and push sync
      if: steps.changes.outputs.count != '0'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git add -A
        if git diff --cached --quiet; then
          echo "merge produced no changes"
          exit 0
        fi
        RANGE="$(git rev-parse --short upstream/master~${{ steps.changes.outputs.count }})..$(git rev-parse --short upstream/master)"
        git commit -m "chore(sync): 合并上游 master ($RANGE)"
        git push origin zh-cn
